<script>
'use strict';
// <PURE>
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDate(raw,now=new Date()){
  const head=raw.split('\n').slice(0,6).join('\n');
  const mm=head.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?/i);
  if(!mm)return iso(now.getFullYear(),now.getMonth(),now.getDate());
  const m=MON.indexOf(mm[1].toLowerCase()),d=+mm[2];let y=mm[3]?+mm[3]:now.getFullYear();
  if(!mm[3]&&new Date(y,m,d)-now>3*864e5)y--;
  return iso(y,m,d);
}

function parseLesson(raw,now){
  const lines=raw.replace(/\r/g,'').split('\n').map(l=>l.trim());
  const L={date:parseDate(raw,now),course:'',book:'',title:'',pron:[],vocab:[],sentences:[],homework:'',next:'',raw:raw.trim()};
  let sec='',cur=null,grp=null,wrong=null;
  for(const line of lines){
    if(!line)continue;
    if(/Today'?s Lesson/i.test(line)){sec='lesson';continue}
    if(/Pronunciation Practice/i.test(line)){sec='pron';continue}
    if(/Vocabular/i.test(line)&&!/^Example/i.test(line)){sec='vocab';cur=null;grp=null;continue}
    if(/Sentence Construction/i.test(line)){sec='sent';continue}
    if(/Homework\s*:/i.test(line)){sec='hw';L.homework=line.replace(/^.*Homework\s*:\s*/i,'');continue}
    if(/Next Lesson/i.test(line)){sec='next';continue}
    if(sec==='lesson'||sec==='next'){
      let m;
      if(sec==='lesson'){
        if((m=line.match(/^Course\s*:\s*(.*)/i)))L.course=m[1];
        else if((m=line.match(/^Book\/?Website\s*:\s*(.*)/i)))L.book=m[1];
        else if((m=line.match(/^Title\/?page\s*:\s*(.*)/i)))L.title=m[1];
      }else{L.next+=(L.next?' · ':'')+line.replace(/^(Course|Book\/Website|Title\/page)\s*:\s*/i,'')}
    }else if(sec==='pron'){
      const m=line.match(/^(.+?)\s*\[(.+?)\]\s*$/);
      if(m)L.pron.push({word:m[1].trim(),ipa:m[2].trim()});
    }else if(sec==='vocab'){
      let m;
      if((m=line.match(/^Example\s*:\s*(.*)/i))){if(cur)cur.example=m[1];continue}
      if((m=line.match(/^🔔\s*(.+?)\s*:?\s*$/))){if(cur){grp={label:m[1].replace(/:$/,''),words:[]};cur.groups.push(grp)}continue}
      if((m=line.match(/^(.+?)\s*\(([^)]+)\)\s*[-–—:]\s*(.+)$/))){
        cur={word:m[1].trim(),pos:m[2].trim(),def:m[3].trim(),example:'',groups:[]};grp=null;L.vocab.push(cur);continue}
      if(cur&&grp)grp.words.push(line.replace(/^[-•·]\s*/,''));
    }else if(sec==='sent'){
      let m;
      if((m=line.match(/You said\s*:\s*(.*)/i)))wrong=m[1].trim();
      else if((m=line.match(/Better say\s*:\s*(.*)/i))){L.sentences.push({wrong:wrong||'',better:m[1].trim()});wrong=null}
    }
  }
  return L;
}

const CONTR_SP={"won't":['will','not'],"can't":['can','not'],"cannot":['can','not'],"let's":['let','us'],"i'm":['i','am'],"ain't":['is','not']};
function expand(w){
  if(CONTR_SP[w])return CONTR_SP[w];
  let m;
  if((m=w.match(/^(.+)n't$/)))return [m[1],'not'];
  if((m=w.match(/^(.+)'re$/)))return [m[1],'are'];
  if((m=w.match(/^(.+)'ve$/)))return [m[1],'have'];
  if((m=w.match(/^(.+)'ll$/)))return [m[1],'will'];
  if((m=w.match(/^(.+)'d$/)))return [m[1],'would'];
  if((m=w.match(/^(it|he|she|that|there|what|here|who|where)'s$/)))return [m[1],'is'];
  return [w];
}
function toks(s){
  const raws=String(s||'').replace(/[’‘]/g,"'").split(/\s+/).filter(Boolean);const out=[];
  raws.forEach((r,i)=>{const w=r.toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,'');if(!w)return;expand(w).forEach(n=>out.push({n,o:i}))});
  return{raws,toks:out};
}
function lcs(a,b){
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i].n===b[j].n?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const mA=new Array(n).fill(false),mB=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i].n===b[j].n){mA[i]=mB[j]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return{L:D[0][0],mA,mB};
}
function sim(user,target){
  const A=toks(target),B=toks(user),{L,mA,mB}=lcs(A.toks,B.toks);
  const mark=(T,mat)=>{const has=T.raws.map(()=>false),ok=T.raws.map(()=>true);T.toks.forEach((t,i)=>{has[t.o]=true;if(!mat[i])ok[t.o]=false});return{has,ok}};
  const a=mark(A,mA),b=mark(B,mB);
  const tot=A.toks.length+B.toks.length;
  return{
    score:tot?2*L/tot:0,
    tHtml:A.raws.map((r,i)=>`<span class="${a.has[i]&&!a.ok[i]?'miss':'ok'}">${esc(r)}</span>`).join(' '),
    uHtml:B.raws.map((r,i)=>`<span class="${b.has[i]&&!b.ok[i]?'extra':'ok'}">${esc(r)}</span>`).join(' ')
  };
}
const verdict=s=>s>=.9?'🎉 완벽해요':s>=.7?'👍 거의 맞아요':'🔁 다시 해볼까요';
// </PURE>

/* ---------- storage ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem('pe_v1'));if(d&&d.lessons){d.settings=Object.assign({key:'',model:'claude-haiku-5-5',rate:.9},d.settings);d.progress=d.progress||{};return d}}catch(e){}
  return{lessons:{},progress:{},settings:{key:'',model:'claude-haiku-5-5',rate:.9}}}
let DB=load();
function save(){try{localStorage.setItem('pe_v1',JSON.stringify(DB))}catch(e){toast('저장 실패: 브라우저 저장공간을 확인하세요')}}
const $=s=>document.querySelector(s);
let toastT;function toast(t){document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600)}

/* ---------- state ---------- */
const now0=new Date();
let S={view:'cal',y:now0.getFullYear(),m:now0.getMonth(),sheet:null,addDate:null,addText:''};
let P=null;

/* ---------- cards ---------- */
function cardsFor(date,types){
  const L=DB.lessons[date];if(!L)return[];const ai=L.ai||{},out=[];
  if(types.includes('pron'))L.pron.forEach((p,i)=>out.push({id:`${date}|p|${i}`,type:'pron',word:p.word,ipa:p.ipa,sentence:(ai.pron||{})[p.word]||''}));
  if(types.includes('vocab'))L.vocab.forEach((v,i)=>out.push({id:`${date}|v|${i}`,type:'vocab',v,examples:[v.example,...((ai.vocab||{})[v.word]||[])].filter(Boolean)}));
  if(types.includes('sent'))L.sentences.forEach((s,i)=>out.push({id:`${date}|s|${i}`,type:'sent',wrong:s.wrong,better:s.better,ko:(ai.ko||[])[i]||''}));
  return out;
}
const allDates=()=>Object.keys(DB.lessons).sort();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- speech ---------- */
let REC=null;
let UTT=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  return vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Natural|Premium|Enhanced/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
function speak(t){
  const ss=window.speechSynthesis;
  if(!ss){toast('이 브라우저는 음성 재생을 지원하지 않아요');return}
  if(ss.speaking||ss.pending)ss.cancel();
  try{ss.resume()}catch(e){}
  const u=new SpeechSynthesisUtterance(t);UTT=u;u.lang='en-US';u.volume=1;u.rate=DB.settings.rate;
  const v=pickVoice();if(v)u.voice=v;
  let started=false;u.onstart=()=>{started=true};
  u.onerror=e=>{if(!/interrupted|canceled/.test(e.error))toast('음성 재생 오류: '+e.error)};
  try{ss.speak(u)}catch(e){toast('음성 재생 실패')}
  setTimeout(()=>{if(!started&&UTT===u)toast(speechSynthesis.getVoices().length&&!pickVoice()?'기기에 영어 음성이 없어요. 휴대폰 설정 > 텍스트 음성 변환(TTS)에서 영어를 설치해 주세요':'소리가 안 나요? 무음(진동) 모드 해제와 미디어 볼륨을 확인해 주세요')},2500);
}
let RECID=0,RECOWNER=null,RECDOG=null;const RECKEEP=[];
function stopRec(){
  RECID++;clearTimeout(RECDOG);
  if(REC){const r=REC;REC=null;r.onresult=r.onerror=r.onaudiostart=null;r.onend=null;try{r.stop()}catch(e){}}
  if(RECOWNER){const o=RECOWNER;RECOWNER=null;o.onEnd&&o.onEnd()}
}
function startRec(o){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){o.onError('unsupported');return}
  stopRec();
  let r;try{r=new SR()}catch(e){o.onError('unsupported');return}
  const id=++RECID;REC=r;RECKEEP.push(r);if(RECKEEP.length>5)RECKEEP.shift();RECOWNER=o;r.lang='en-US';r.interimResults=true;r.continuous=false;
  try{r.maxAlternatives=3}catch(e){}
  let done=false,lastInterim='';
  const live=()=>id===RECID;
  const end=()=>{if(!live())return;clearTimeout(RECDOG);REC=null;RECOWNER=null;try{r.stop()}catch(e){}o.onEnd&&o.onEnd()};
  const finish=best=>{if(done||!live())return;done=true;o.onDone(best);end()};
  const dog=ms=>{clearTimeout(RECDOG);RECDOG=setTimeout(()=>{if(!live())return;if(lastInterim.trim())finish(lastInterim.trim());else{end();o.onError('timeout')}},ms)};
  r.onaudiostart=()=>{if(live()&&o.onListen)o.onListen()};
  r.onresult=e=>{if(!live())return;let interim='',fin=null;
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)fin=res;else interim+=res[0].transcript}
    if(interim){lastInterim=interim;o.onInterim&&o.onInterim(interim);dog(2500)}
    if(fin){const alts=Array.from(fin).map(a=>(a.transcript||'').trim()).filter(Boolean);if(!alts.length)return;let best=alts[0];
      if(o.target)best=alts.map(a=>[a,sim(a,o.target).score]).sort((x,y)=>y[1]-x[1])[0][0];finish(best)}};
  r.onerror=e=>{if(!live())return;if(lastInterim.trim()){finish(lastInterim.trim());return}end();if(e.error!=='aborted')o.onError(e.error)};
  r.onend=()=>{if(!live())return;if(!done&&lastInterim.trim())finish(lastInterim.trim());else{const wasDone=done;end();if(!wasDone)o.onError('no-speech')}};
  dog(8000);
  try{r.start()}catch(e){end();o.onError('start')}
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
function recErr(e){
  const m={
    unsupported:isIOS?'이 화면에서는 음성인식이 안 돼요. 홈 화면 아이콘 대신 Safari에서 직접 열어 주세요':'이 브라우저는 음성인식을 지원하지 않아요 (Chrome 권장)',
    'not-allowed':isIOS?'마이크·음성인식 권한이 꺼져 있어요. 설정 > 앱 > Safari > 마이크를 "허용"으로 바꿔 주세요':'마이크 권한을 허용해 주세요 (주소창 왼쪽 자물쇠 아이콘)',
    'service-not-allowed':isIOS?'음성인식이 꺼져 있어요. 설정 > 일반 > 키보드 > "받아쓰기 활성화"를 켜 주세요 (홈 화면 아이콘으로 열었다면 Safari에서 열어 주세요)':'음성인식 서비스를 쓸 수 없어요. 브라우저를 Chrome으로 바꿔 보세요',
    'no-speech':'음성이 들리지 않았어요. 버튼을 누르고 바로 말해 보세요',
    'audio-capture':'마이크를 찾을 수 없어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요',
    network:'인터넷 연결을 확인해 주세요 (음성인식은 인터넷이 필요해요)',
    aborted:'음성인식이 중단됐어요. 다시 눌러 주세요',
    'language-not-supported':'기기에서 영어 음성인식을 지원하지 않아요. 키보드 설정에 영어(미국)를 추가해 주세요',
    start:'음성인식을 시작하지 못했어요. 잠시 뒤 다시 눌러 주세요',
    timeout:isIOS?'목소리가 인식되지 않았어요. 아래 ⌨️ 칸을 누르고 키보드의 🎤 버튼으로 말해 보세요':'목소리가 인식되지 않았어요. 다시 눌러 주세요'};
  toast(m[e]||('음성인식 오류: '+e));
}

/* ---------- AI (optional, user's own API key) ---------- */
async function claude(prompt,max){
  const k=DB.settings.key;if(!k)throw new Error('설정에서 API 키를 먼저 입력하세요');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:DB.settings.model,max_tokens:max,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('API 오류 '+r.status+': '+(await r.text()).slice(0,200));
  const j=await r.json();return j.content.map(c=>c.text||'').join('');
}
async function enrich(date){
  const L=DB.lessons[date];
  const payload={sentences:L.sentences.map(s=>s.better),pron:L.pron.map(p=>p.word),vocab:L.vocab.map(v=>({word:v.word,pos:v.pos,def:v.def}))};
  const txt=await claude(`You are helping a Korean adult learner (OPIc prep) review a phone-English lesson. Reply with ONLY valid JSON, no markdown fences, in this exact shape:

  retry(){const w=P.results.filter(r=>r.score!=null&&r.score<.8).map(r=>r.c);startPractice(w,P.title)},
  testvoice(){const v=window.speechSynthesis&&pickVoice();speak('Hello! This is how I will read your sentences.');if(v)setTimeout(()=>toast('사용 음성: '+v.name),300)},
  exp(){$('#bk').value=bk();toast('아래 칸에 백업이 만들어졌어요')},
  async copybk(){const t=$('#bk').value;if(!t)return toast('먼저 “백업 만들기”를 누르세요');try{await navigator.clipboard.writeText(t);toast('복사했어요')}catch(e){$('#bk').select();toast('길게 눌러 복사하세요')}},
  dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bk()],{type:'application/json'}));a.download='phone-english-backup-'+iso(now0.getFullYear(),now0.getMonth(),now0.getDate())+'.json';document.body.appendChild(a);a.click();a.remove()},
  imp(){try{const d=JSON.parse($('#bk').value);/*key not restored*/if(!d.lessons)throw 0;Object.assign(DB.lessons,d.lessons);Object.assign(DB.progress,d.progress||{});save();toast('복원했어요 ('+Object.keys(d.lessons).length+'일)');render()}catch(e){toast('백업 형식이 올바르지 않아요')}}
};
const bk=()=>JSON.stringify({...DB,settings:{...DB.settings,key:''}});
function startPractice(cards,title){
  if(!cards.length)return toast('복습할 문제가 없어요');
  P={cards,i:0,title,results:[],scores:{},targets:[]};S.sheet=null;render();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closeSheet'&&e.target!==el)return;
  const f=acts[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('kb')){e.preventDefault();e.target.blur();acts.tcheck(e.target)}});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='paste')updatePreview();
  else if(id==='pdate'){e.target.dataset.touched='1';S.addDate=e.target.value}
  else if(id==='skey'){DB.settings.key=e.target.value.trim();save()}
  else if(id==='smodel'){DB.settings.model=e.target.value.trim()||'claude-haiku-5-5';save()}
  else if(id==='srate'){DB.settings.rate=+e.target.value;$('#rv2').textContent=e.target.value;save()}
});
if('speechSynthesis' in window)speechSynthesis.getVoices();
render();
</script>
</body>
</html>
